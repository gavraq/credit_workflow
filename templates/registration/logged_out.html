{% extends "credit_workflow/base.html" %}

{% block title %}Logged Out{% endblock %}

{% block sidebar %}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="card-title mb-0">Logged Out Successfully</h4>
            </div>
            <div class="card-body p-4">
                <p class="card-text">You have been successfully logged out. Thank you for using the Credit Workflow system.</p>
                <div class="d-grid gap-2">
                    <a href="{% url 'login' %}" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login Again
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
