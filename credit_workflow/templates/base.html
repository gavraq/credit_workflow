<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Credit Workflow{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body style="margin:0;padding:0;">
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #174EA6; height: 56px; margin-bottom: 0;">
  <a class="navbar-brand d-flex align-items-center" href="/" style="height: 56px;">
    <img src="{% static 'img/logo.jpg' %}" alt="Logo" class="me-2" style="height:40px; width:auto;">
    Credit Workflow
  </a>
</nav>
<div class="d-flex" style="min-height: calc(100vh - 56px);">
    {% block sidebar %}{% endblock %}
    <main class="flex-grow-1" style="padding: 32px;">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
